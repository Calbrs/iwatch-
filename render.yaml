# render.yaml – Deploy this app to Render as a Free Web Service
# 1. In the Render Dashboard: New Web Service → Docker
# 2. Set the Dockerfile field to point at this repo's Dockerfile
# 3. Render automatically sets the PORT env var; our app reads it.
# 6. Because Render free spins down after 15 min of inactivity, the first
#    request triggers a cold‑start (~1 min). Subsequent traffic keeps it alive.
#    Note: YOLOv8n runs on CPU only; fps will be lower than on a local GPU,
#    but the device‑to‑cloud WebSocket path is direct, which feels smooth.

services:
  - type: web
    name: clinic-tracker
    env: docker
    plan: free
    dockerfile: Dockerfile
    healthCheckPath: /api/cameras
    autoDeploy: false

ports:
  - internal: 5000
    external: 5000