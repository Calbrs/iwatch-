<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Camera</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Local Camera</h1>
        <p class="subtitle">Streaming from this browser to the tracker</p>
        <nav>
            <a class="btn" href="/">← Dashboard</a>
            <a class="btn" href="/devices">Device Links</a>
        </nav>
    </header>

    <section class="card">
        <div id="status">Connecting...</div>
        <div class="preview-row">
            <div class="preview-panel">
                <video id="self-view" autoplay playsinline muted></video>
                <div id="cam-status" class="status">Requesting camera...</div>
            </div>
        </div>
    </section>

    <script>
        var link_code = "{{ link_code }}";
        var ws = null;
        var stream = null;
        var video = document.getElementById("self-view");
        var statusEl = document.getElementById("status");
        var camStatusEl = document.getElementById("cam-status");
        var streaming = false;
        var frameSeq = 0;
        var lastTelemMs = 0;
        var sendLog = [];
        var POLL_MS = 3000;

        function setStatus(text) {
            if (statusEl.textContent !== text) statusEl.textContent = text;
        }
        function setCamStatus(text) {
            if (camStatusEl.textContent !== text) camStatusEl.textContent = text;
        }

        function connect() {
            if (ws) {
                var st = ws.readyState;
                if (st === WebSocket.OPEN || st === WebSocket.CONNECTING) return;
                try { ws.close(); } catch (e) {}
            }
            var proto = location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(proto + "//" + location.host + "/ws/cam/" + link_code);
            ws.binaryType = "arraybuffer";
            ws.onopen = function () {
                setStatus("Connected — streaming live");
                setCamStatus("Live preview — streaming.");
            };
            ws.onmessage = function (ev) {
                if (typeof ev.data !== "string") return;
                var msg;
                try { msg = JSON.parse(ev.data); } catch (e) { return; }
                if (msg.type === "active") {
                    streaming = true;
                    setStatus("Approved — streaming live");
                    setCamStatus("Live preview — streaming.");
                    startSending();
                } else if (msg.type === "error") {
                    setStatus("Server error: " + (msg.message || "unknown"));
                }
            };
            ws.onclose = function () {
                setStatus("Disconnected — retrying...");
                setCamStatus("Reconnecting...");
                scheduleReconnect();
            };
            ws.onerror = function () {
                setStatus("Connection error — retrying...");
            };
        }

        function scheduleReconnect() {
            setTimeout(connect, 2000);
        }

        function startSending() {
            if (streaming && video.videoWidth) {
                requestAnimationFrame(sendFrame);
            }
        }

        function sendFrame() {
            if (!streaming || !ws || ws.readyState !== WebSocket.OPEN) {
                requestAnimationFrame(sendFrame);
                return;
            }
            if (!video.videoWidth) {
                requestAnimationFrame(sendFrame);
                return;
            }
            var canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            var ctx = canvas.getContext("2d");
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(function (blob) {
                if (!blob) { requestAnimationFrame(sendFrame); return; }
                var reader = new FileReader();
                reader.onload = function () {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        try { ws.send(reader.result); } catch (e) {}
                    }
                    frameSeq++;
                    sendLog.push(performance.now());
                    if (sendLog.length > 200) sendLog.shift();
                    if (frameSeq % 10 === 0) {
                        var now = performance.now();
                        var recent = sendLog.filter(function (t) { return now - t < 1000; });
                        var fps = recent.length;
                        setCamStatus("Streaming — " + frameSeq + " frames ~" + fps + " fps");
                    }
                    requestAnimationFrame(sendFrame);
                };
                reader.readAsArrayBuffer(blob);
            }, "image/jpeg", 0.7);
        }

        function allowCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setStatus("Camera API is not available on this browser/connection.");
                setCamStatus("Camera unavailable.");
                return;
            }
            navigator.mediaDevices.getUserMedia({ audio: false, video: true })
                .then(function (s) {
                    stream = s;
                    video.srcObject = s;
                    return video.play().catch(function () {});
                })
                .then(function () {
                    connect();
                })
                .catch(function (e) {
                    setStatus("Camera access denied: " + (e.message || e.name || e)
                              + " — tap the preview to try again.");
                    setCamStatus("Camera blocked. Tap the preview to request access.");
                });
        }

        video.addEventListener("click", function () {
            if (!stream) allowCamera();
        });

        // Start immediately: request camera + connect
        allowCamera();
    </script>
</body>
</html>
